# 身份证正面（人像面）
# 新增一类证件 = 复制一份本文件改内容，不改代码（验收彩蛋）
type_id: id_front
name: 身份证正面

classification:
  required: [公民身份号码]          # 强特征：出现即基本锁定
  positive: [居民身份证, 姓名, 性别, 民族, 出生, 住址]
  negative: [机动车驾驶证, 营业执照, 签发机关]   # 反向排除

fields:
  - name: 姓名
    anchors: [姓名]
    position: next_line             # 值在标签下一行/右侧
  - name: 性别
    anchors: [性别]
    type: enum
    allowed: [男, 女]
  - name: 民族
    anchors: [民族]
  - name: 出生日期
    anchors: [出生日期, 出生]
    type: date
  - name: 住址
    anchors: [住址]
    position: next_line
    multi_line: true                # 地址常折行，需向下吞行
  - name: 公民身份号码
    anchors: [公民身份号码, 身份号码, 身份证号码]
    type: chinese_id
    pattern: '[0-9Xx]{15,18}'

cross_checks:
  - kind: idcard_birth_match        # 出生日期 == 证号7~14位
    id_field: 公民身份号码
    date_field: 出生日期
  - kind: idcard_gender_match       # 性别 == 证号第17位奇偶
    id_field: 公民身份号码
    gender_field: 性别
