<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>制度知识库</title>
<style>
  :root{
    --bg:#eff1f5; --card:#ffffff; --line:#e5e7eb; --line-strong:#d9dde3;
    --brand:#2f54eb; --brand-weak:#eef2ff; --brand-grad:linear-gradient(135deg,#4a6cf7,#2f54eb);
    --ink:#111827; --txt:#374151; --sub:#6b7280; --faint:#9ca3af;
    --ok:#1d9e5f; --ok-bg:#e5f6ed; --warn:#d97706; --warn-bg:#fdf3e3; --err:#d84b4b; --err-bg:#fdeaea;
    --radius:12px; --shadow:0 1px 3px rgba(17,24,39,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font:14px/1.65 -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
       background:var(--bg);color:var(--txt);padding:12px}

  /* ============ 应用外框：灰底上的白色大卡片 ============ */
  #app{background:var(--card);border:1px solid var(--line);border-radius:16px;
       height:calc(100vh - 24px);display:flex;overflow:hidden;box-shadow:0 2px 10px rgba(17,24,39,.04)}

  /* ============ 左侧栏 ============ */
  aside{width:237px;flex:0 0 237px;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--card)}
  aside.hidden{display:none}
  .side-top{padding:16px 16px 10px}
  .logo-row{display:flex;align-items:center;gap:9px;margin-bottom:14px}
  .logo-badge{width:30px;height:30px;border-radius:9px;background:var(--brand-grad);color:#fff;
              display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto;
              box-shadow:0 3px 8px rgba(47,84,235,.28)}
  .logo-row b{font-size:14px;color:var(--ink);letter-spacing:.5px}
  .btn-new{width:100%;height:40px;border:1px solid #d1d5db;border-radius:8px;background:#fff;
           color:var(--brand);font-size:14px;font-weight:500;cursor:pointer;transition:.15s}
  .btn-new:hover{background:var(--brand-weak);border-color:var(--brand)}
  .group-label{padding:14px 18px 6px;font-size:12px;color:var(--sub)}
  #convs{flex:1;overflow:auto;padding:0 10px 10px}
  .conv-item{display:block;padding:9px 10px;border-radius:8px;cursor:pointer;transition:.12s}
  .conv-item:hover{background:#f3f4f6}
  .conv-item.on{background:var(--brand-weak)}
  .conv-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .conv-title{font-size:13px;font-weight:500;color:var(--ink);min-width:0;flex:1;
              white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .conv-item.on .conv-title{color:var(--brand)}
  .conv-time{font-size:11px;color:var(--faint);flex:0 0 auto}
  .conv-empty{padding:6px 12px;font-size:13px;color:#b0b6be}
  .side-foot{padding:10px 18px;border-top:1px solid var(--line);font-size:11px;color:var(--faint)}

  /* ============ 右侧主区 ============ */
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{height:56px;flex:0 0 56px;border-bottom:1px solid var(--line);display:flex;align-items:center;
          justify-content:space-between;padding:0 22px}
  .topbar .title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--txt)}
  .topbar .title .dot{width:16px;height:16px;border-radius:50%;background:#f3f4f6;display:flex;
                      align-items:center;justify-content:center;font-size:10px;color:var(--sub)}
  .views{display:flex;gap:2px;background:#f3f4f6;border-radius:9px;padding:3px}
  .views button{border:0;background:none;padding:5px 14px;border-radius:7px;font-size:13px;
                color:var(--sub);cursor:pointer;transition:.15s}
  .views button.on{background:#fff;color:var(--brand);font-weight:600;box-shadow:0 1px 2px rgba(17,24,39,.08)}
  .content{flex:1;min-height:0;display:flex;flex-direction:column}

  /* ============ 问答：消息区 ============ */
  #view-qa{flex:1;display:flex;flex-direction:column;min-height:0}
  #msgs{flex:1;overflow:auto;padding:26px 40px 10px;scroll-behavior:smooth}
  .msg{display:flex;gap:10px;align-items:flex-start;margin-bottom:26px}
  .msg::before{content:"";flex:0 0 32px;width:32px;height:32px;border-radius:50%;margin-top:2px;
               display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .msg.user::before{content:"我";background:#e8e8e8;color:#555}
  .msg.bot::before{content:"";background:#fff no-repeat center/20px;border:1px solid #dce4f2;background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'><g stroke='%235B5FEF' stroke-width='6' fill='none' stroke-linecap='round'><line x1='48' y1='20' x2='48' y2='29'/><rect x='25' y='29' width='46' height='38' rx='9' fill='%23FFFFFF'/></g><circle cx='48' cy='15' r='4.5' fill='%235B5FEF'/><rect x='14' y='40' width='7' height='16' rx='3.5' fill='%235B5FEF'/><rect x='75' y='40' width='7' height='16' rx='3.5' fill='%235B5FEF'/><circle cx='39' cy='48' r='4' fill='%235B5FEF'/><circle cx='57' cy='48' r='4' fill='%235B5FEF'/></svg>");box-shadow:0 1px 3px rgba(17,24,39,.08)}
  .mbody{flex:1;min-width:0;max-width:78%;white-space:pre-wrap;word-break:break-word}
  .msg.bot .mbody{padding-top:4px}
  .msg.user{margin-bottom:12px}
  .msg.user .mbody{flex:0 1 auto;color:var(--ink);font-size:14.5px;line-height:1.65;padding-top:4px}
  .qa-answer{white-space:normal;color:var(--txt);font-size:14.5px;line-height:1.7}
  .qa-answer p{margin:0 0 8px}
  .qa-answer p:last-child{margin-bottom:0}
  .qa-answer ul,.qa-answer ol{margin:4px 0 8px;padding-left:22px}
  .qa-answer li{margin:2px 0}
  .qa-answer strong{color:var(--ink)}
  .qa-answer h4{margin:10px 0 6px;font-size:14px;color:var(--ink)}
  .qa-answer table{margin:8px 0;border-collapse:collapse}
  .qa-answer th,.qa-answer td{border:1px solid var(--line);padding:5px 10px;font-size:13px}
  .qa-answer th{background:#f0f4fb}
  .qa-answer:empty{display:none}
  .cite{display:inline-block;background:var(--brand-weak);border:1px solid #c9d6ff;color:var(--brand);
        border-radius:6px;padding:0 6px;margin:0 2px;font-size:12px;cursor:pointer;transition:.12s}
  .cite:hover{background:var(--brand);color:#fff}
  /* 查阅轨迹 */
  .qa-trace{margin-bottom:8px;border:1px dashed var(--line-strong);background:#fafbfd;border-radius:10px;
            padding:8px 12px;font-size:12.5px;color:var(--sub)}
  .qa-trace[hidden]{display:none}
  .qa-trace summary{cursor:pointer;width:fit-content;color:var(--sub);font-weight:500;user-select:none;list-style:none}
  .qa-trace summary::before{content:"🔍 "}
  .qa-trace summary::-webkit-details-marker{display:none}
  .qa-trace ol{margin:8px 0 2px;padding-left:4px;list-style:none}
  .qa-trace li{padding:3px 0 3px 22px;position:relative}
  .qa-trace li::before{content:"";position:absolute;left:6px;top:11px;width:7px;height:7px;border-radius:50%;
                       background:#c3cade;transition:background .25s}
  .qa-trace li:not(.done)::before{animation:dotPulse 1.2s ease-in-out infinite}
  .qa-trace li.done::before{background:var(--brand)}
  @keyframes dotPulse{0%,100%{box-shadow:0 0 0 0 rgba(47,84,235,.28)}50%{box-shadow:0 0 0 4px rgba(47,84,235,.1)}}
  .qa-status{font-size:12.5px;color:var(--faint);margin-top:6px}
  .qa-status.err{color:var(--err)}


  /* ============ 输入区 ============ */
  .askbar{flex:0 0 auto;padding:10px 40px 14px}
  .ask-box{display:flex;align-items:flex-end;gap:10px;background:#fff;border:1px solid var(--line-strong);
           border-radius:12px;padding:8px 8px 8px 14px;box-shadow:var(--shadow);transition:.15s}
  .ask-box:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,84,235,.1)}
  .ask-box textarea{flex:1;border:0;outline:none;resize:none;
                    font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
                    font-size:15px;line-height:1.6;color:var(--txt);
                    max-height:120px;background:transparent;padding:6px 0}
  .ask-box textarea::placeholder{color:var(--faint)}
  .btn-send{flex:0 0 auto;border:0;background:#e8ecf5;color:var(--txt);border-radius:8px;height:36px;
            padding:0 16px;font-size:13px;font-weight:500;cursor:pointer;transition:.15s;display:flex;
            align-items:center;gap:6px}
  .btn-send:hover{background:var(--brand);color:#fff}
  .btn-send:disabled{opacity:.5;cursor:default}
  .kbd-hint{text-align:center;font-size:12px;color:var(--faint);margin-top:8px}

  /* ============ 文档库 / 评测 ============ */
  .page{flex:1;overflow:auto;padding:24px 32px;display:none}
  .page.on{display:block}
  .stats{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  .stat{flex:1;min-width:120px;background:#fff;border:1px solid var(--line);border-radius:12px;
        padding:14px 16px;text-align:center;box-shadow:var(--shadow)}
  .stat b{display:block;font-size:24px;color:var(--brand);font-weight:700}
  .stat span{font-size:12px;color:var(--sub)}
  .toolbar{display:flex;gap:10px;margin-bottom:16px;align-items:center;flex-wrap:wrap}
  .btn{border:0;background:var(--brand);color:#fff;border-radius:8px;padding:8px 16px;cursor:pointer;
       font-size:13px;font-weight:500;transition:.15s}
  .btn:hover{background:#2640c0}
  .btn.ghost{background:#fff;color:var(--txt);border:1px solid var(--line-strong)}
  .btn.ghost:hover{border-color:var(--brand);color:var(--brand);background:#fff}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.mini{padding:3px 10px;font-size:12px;border-radius:6px}
  .hint-inline{font-size:12.5px;color:var(--faint)}
  .table-wrap{border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
  table{width:100%;border-collapse:collapse;background:#fff}
  th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}
  tr:last-child td{border-bottom:0}
  th{background:#f8fafc;color:var(--sub);font-weight:600;font-size:12.5px}
  .pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:500}
  .pill.pending{background:#eef2f7;color:var(--sub)}
  .pill.processing{background:var(--brand-weak);color:var(--brand)}
  .pill.ready{background:var(--ok-bg);color:var(--ok)}
  .pill.failed{background:var(--err-bg);color:var(--err)}
  .pill.old{background:var(--warn-bg);color:var(--warn)}
  .prog-card{background:var(--brand-weak);border:1px solid #d6e0ff;color:var(--brand);border-radius:10px;
             padding:10px 14px;margin-bottom:14px;font-size:13px}

  /* ============ 出处抽屉 ============ */
  #drawer{position:fixed;top:0;right:-500px;width:480px;height:100%;background:#fff;border-left:1px solid var(--line);
          box-shadow:-6px 0 24px rgba(17,24,39,.1);transition:right .22s;z-index:30;display:flex;flex-direction:column}
  #drawer.open{right:0}
  #drawer .head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;
                align-items:center;font-weight:600;color:var(--ink)}
  #drawer .body{flex:1;overflow:auto;padding:16px 18px}
  #drawer table{margin:8px 0}
  .muted{color:var(--sub);font-size:12.5px}

  /* ============ 弹窗 ============ */
  .modal-bg{position:fixed;inset:0;background:rgba(17,24,39,.4);display:none;align-items:center;
            justify-content:center;z-index:40}
  .modal-bg.open{display:flex}
  .modal{background:#fff;border-radius:14px;width:660px;max-height:84vh;display:flex;flex-direction:column;
         box-shadow:0 20px 60px rgba(17,24,39,.25)}
  .modal .head{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;
               font-weight:600;color:var(--ink);align-items:center}
  .modal .body{padding:18px 20px;overflow:auto}
  .toc-item{padding:3px 0 3px 12px;border-left:2px solid var(--brand-weak);color:var(--sub);font-size:13px}
  .chunk{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
  .chunk .tag{font-size:12px;color:var(--brand);background:var(--brand-weak);border-radius:6px;
              padding:1px 8px;margin-right:8px}

  @media (max-width:860px){
    aside{display:none}
    #msgs,.askbar{padding-left:16px;padding-right:16px}
    .msg{max-width:88%}
  }
</style>
</head>
<body>

<div id="app">
  <!-- ============ 左侧栏：新建对话 + 历史会话 ============ -->
  <aside id="sidebar">
    <div class="side-top">
      <div class="logo-row"><div class="logo-badge">库</div><b>制度知识库</b></div>
      <button class="btn-new" onclick="newConv()">＋ 新建对话</button>
    </div>
    <div class="group-label">历史会话</div>
    <div id="convs"><div class="conv-empty">暂无历史会话</div></div>
    <div class="side-foot">回答附出处 · 查无即明说</div>
  </aside>

  <!-- ============ 右侧主区 ============ -->
  <section class="main">
    <header class="topbar">
      <div class="title" id="top-title"><span class="dot">💬</span><span id="top-title-text">当前对话</span></div>
      <div class="views" id="nav">
        <button data-v="qa" class="on">问答</button>
        <button data-v="docs">文档库</button>
        <button data-v="eval">评测集</button>
      </div>
    </header>

    <div class="content">
      <!-- ======== 问答 ======== -->
      <div id="view-qa" style="display:flex;flex-direction:column">
        <div id="msgs" style="display:none"></div>
        <div class="askbar">
          <div class="ask-box">
            <textarea id="q" rows="1" placeholder="输入问题，例如「出差审批需要什么手续？」"
              oninput="autoGrow(this)" onkeydown="askKey(event)"></textarea>
            <button class="btn-send" id="ask-btn" onclick="ask()">▷ 发送</button>
          </div>
          <div class="kbd-hint">Enter 发送 · Shift + Enter 换行</div>
        </div>
      </div>

      <!-- ======== 文档库 ======== -->
      <div class="page" id="view-docs">
        <div class="stats" id="doc-stats"></div>
        <div class="toolbar">
          <button class="btn" onclick="openImport()">＋ 导入文档</button>
          <button class="btn ghost" onclick="rebuildIndex()">重建索引</button>
          <span class="hint-inline" id="queue-hint"></span>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>文件名</th><th>格式</th><th>页数</th><th>表格</th><th>流程图</th><th>版本</th><th>状态</th><th>操作</th></tr></thead>
            <tbody id="doc-rows"></tbody>
          </table>
        </div>
      </div>

      <!-- ======== 评测集 ======== -->
      <div class="page" id="view-eval">
        <div class="stats" id="eval-stats"></div>
        <div class="toolbar">
          <button class="btn ghost" onclick="document.getElementById('csv-input').click()">导入 CSV</button>
          <button class="btn" onclick="runEval()" id="eval-run-btn">▶ 全部运行</button>
          <input type="file" id="csv-input" accept=".csv" style="display:none" onchange="importCsv(this.files)">
        </div>
        <div class="prog-card" id="eval-prog" style="display:none"></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>类型</th><th>问题</th><th>标准答案</th><th>系统回答</th><th>出处对</th><th>结果</th></tr></thead>
            <tbody id="eval-rows"></tbody>
          </table>
        </div>
      </div>
    </div>
  </section>
</div>

<!-- ============ 出处抽屉 ============ -->
<div id="drawer">
  <div class="head"><span id="drawer-title">出处</span><button class="btn mini ghost" onclick="closeDrawer()">关闭</button></div>
  <div class="body" id="drawer-body"></div>
</div>
<!-- ============ 弹窗 ============ -->
<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <div class="head"><span id="modal-title"></span><button class="btn mini ghost" onclick="closeModal()">✕</button></div>
    <div class="body" id="modal-body"></div>
  </div>
</div>

<script>
const API='/api/v1';
let convId=null, activeAsk=null, docTimer=null, evalRunId=null;
const $=id=>document.getElementById(id);

/* ---------- 视图切换 ---------- */
const VIEW_TITLES={qa:['💬','当前对话'],docs:['📚','文档库'],eval:['📊','评测集']};
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#nav button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  const v=b.dataset.v;
  $('sidebar').classList.toggle('hidden',v!=='qa');
  $('view-qa').style.display=v==='qa'?'flex':'none';
  $('view-docs').classList.toggle('on',v==='docs');
  $('view-eval').classList.toggle('on',v==='eval');
  const [ico,text]=VIEW_TITLES[v];
  $('top-title').innerHTML=`<span class="dot">${ico}</span><span>${text}</span>`;
  if(v==='docs')loadDocs(); if(v==='eval')loadEval(); if(v==='qa')loadConvs();
});

/* ---------- 欢迎态 / 会话列表 ---------- */
function checkWelcome(){
  $('msgs').style.display='block';
}
function fmtTime(unix){
  if(!unix)return '';
  const d=new Date(unix*1000),now=new Date();
  const pad=n=>String(n).padStart(2,'0');
  if(d.toDateString()===now.toDateString())return pad(d.getHours())+':'+pad(d.getMinutes());
  if(d.getFullYear()===now.getFullYear())return pad(d.getMonth()+1)+'-'+pad(d.getDate());
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
async function loadConvs(){
  const r=await (await fetch(API+'/conversations')).json();
  $('convs').innerHTML=(r.conversations||[]).map(c=>{
    const t=fmtTime(c.created_at);
    return `<div class="conv-item${c.id===convId?' on':''}" onclick="openConv(${c.id})" title="${esc(c.title)}">
      <div class="conv-row"><span class="conv-title">${esc(c.title)}</span><span class="conv-time">${t}</span></div>
    </div>`;}).join('')
    ||'<div class="conv-empty">暂无历史会话</div>';
}
function selectConversation(id){
  convId=id;
  if(id===null)sessionStorage.removeItem('kb-conversation');
  else sessionStorage.setItem('kb-conversation',String(id));
  loadConvs();
}
function cancelAsk(){
  if(activeAsk)activeAsk.controller.abort();
  activeAsk=null;
  $('ask-btn').disabled=false;
}
function newConv(){
  cancelAsk();
  selectConversation(null);
  $('msgs').replaceChildren();
  checkWelcome();
}

/* ---------- 会话回放 ---------- */
async function openConv(id,retries=4){
  cancelAsk();
  selectConversation(id);
  const box=$('msgs');
  box.replaceChildren();
  checkWelcome();
  try{
    const response=await fetch(API+`/conversations/${id}/messages?include_tools=true`);
    if(id!==convId||activeAsk)return;
    if(!response.ok){
      if(response.status===404)newConv();
      else box.textContent='会话加载失败，请重试。';
      return;
    }
    const data=await response.json();
    if(id!==convId||activeAsk)return;
    let turn=null,awaitingAnswer=false;
    for(const message of data.messages){
      if(message.role==='user'){
        turn=createTurn(box,message.content);
        turn.status.textContent='回答未完成';
        awaitingAnswer=true;
      }else if(turn&&message.tool_calls){
        for(const call of message.tool_calls){
          addToolCall(turn,call.id,call.function.name,JSON.parse(call.function.arguments));
        }
      }else if(turn&&message.role==='tool'){
        const result=JSON.parse(message.content);
        finishToolCall(turn,message.tool_call_id,result.count||0,result.message||'',
                       hitsFromBlocks(result.blocks));
      }else if(turn&&message.role==='assistant'){
        turn.answer.innerHTML=renderCites(message.content,message.citations);
        turn.status.textContent=message.incomplete?incompleteLabel(message.status):'';
        turn.trace.open=false;
        awaitingAnswer=false;
      }
    }
    checkWelcome();
    box.scrollTop=box.scrollHeight;
    if(awaitingAnswer&&retries){
      setTimeout(()=>{ if(id===convId&&!activeAsk)openConv(id,retries-1); },350);
    }
  }catch{
    if(id===convId&&!activeAsk)box.textContent='会话加载失败，请重试。';
  }
}

/* ---------- 提问与 SSE ---------- */
function mdInline(t){
  return t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
          .replace(/`([^`]+)`/g,'<code>$1</code>');
}
function mdToHtml(text){
  const lines=esc(text).split(String.fromCharCode(10));
  const out=[];let list=null,table=null;
  const flush=()=>{if(list){out.push('</'+list+'>');list=null;}
                   if(table){out.push('</tbody></table>');table=null;}};
  for(const line of lines){
    const t=line.trim();
    if(!t){flush();out.push('');continue;}
    if(t.startsWith('|')&&t.endsWith('|')){
      const cells=t.slice(1,-1).split('|').map(c=>c.trim());
      if(cells.every(c=>/^:?-{2,}:?$/.test(c))){continue;}  // 分隔行
      if(!table){flush();table=true;out.push('<table>');}
      out.push('<tr>'+cells.map(c=>'<td>'+mdInline(c)+'</td>').join('')+'</tr>');
      continue;
    }
    if(table){out.push('</tbody></table>');table=null;}
    const ol=t.match(/^(\d+)[.、]\s+(.*)/),ul=t.match(/^[-*•]\s+(.*)/);
    if(ol){if(list!=='ol'){flush();list='ol';out.push('<ol>');}out.push('<li>'+mdInline(ol[2])+'</li>');continue;}
    if(ul){if(list!=='ul'){flush();list='ul';out.push('<ul>');}out.push('<li>'+mdInline(ul[1])+'</li>');continue;}
    const h=t.match(/^#{1,4}\s+(.*)/);
    if(h){flush();out.push('<h4>'+mdInline(h[1])+'</h4>');continue;}
    flush();out.push('<p>'+mdInline(t)+'</p>');
  }
  flush();
  return out.filter(x=>x!=='').join('');
}
function renderCites(text,cites){
  return mdToHtml(text).replace(/\[(\d+)\]/g,(match,n)=>{
    const c=(cites||[]).find(item=>item.n===Number(n));
    return c?`<button type="button" class="cite" title="${esc(c.label)}" onclick="showChunk(${Number(c.chunk_id)})">[${n}]</button>`:match;
  });
}
function createTurn(box,question){
  addMsg(box,'user',question);
  const bot=document.createElement('div');bot.className='msg bot';
  const mbody=document.createElement('div');mbody.className='mbody';
  const trace=document.createElement('details');trace.className='qa-trace';trace.hidden=true;
  const summary=document.createElement('summary');summary.textContent='查阅过程';
  const steps=document.createElement('ol');trace.append(summary,steps);
  const answer=document.createElement('div');answer.className='qa-answer';
  const status=document.createElement('div');status.className='qa-status';status.setAttribute('role','status');
  mbody.append(trace,answer,status);bot.appendChild(mbody);box.appendChild(bot);
  return {trace,steps,answer,status,calls:new Map()};
}
function addToolCall(turn,id,name,args){
  const question=args.query?`“${args.query}”`:'';
  const labels={
    search_chunks:`搜索${question}`,
    search_in_doc:`在指定文件内搜索${question}`,
    read_table:'读取完整表格',
    read_neighbors:'查阅前后文',
    read_figure:'查看流程图',
  };
  const label=labels[name]||'查阅资料';
  const step=document.createElement('li');step.textContent=label;
  turn.steps.appendChild(step);turn.calls.set(id,{step,label});
  turn.trace.hidden=false;
}
function hitsFromBlocks(blocks){
  const seen=new Set(),parts=[];
  for(const b of blocks||[]){
    const label=String(b.label||'');if(!label)continue;
    const m=label.match(/第(\d+)页/);
    const key=label.split('·')[0].trim()+(m?'·第'+m[1]+'页':'');
    if(!seen.has(key)){seen.add(key);parts.push(key);}
  }
  return parts.slice(0,3).join('、')+(parts.length>3?'…':'');
}
function finishToolCall(turn,id,count,summary,hits){
  const call=turn.calls.get(id);
  if(!call)return;
  let tail=hits||'';
  if(!tail&&count)tail=`找到 ${count} 块`;
  if(!tail&&summary)tail=summary;
  call.step.textContent=call.label+(tail?` → ${tail}`:'');
  call.step.classList.add('done');
}
function incompleteLabel(status){
  if(status==='timeout')return '问答超时，回答未完成';
  if(status==='disconnected')return '连接中断，回答未完成';
  return '回答未完成';
}
function autoGrow(el){ el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,120)+'px'; }
function askKey(e){
  if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); ask(); }
}
async function ask(){
  const input=$('q');
  const q=input.value.trim();
  if(!q||activeAsk)return;
  const request={controller:new AbortController()};
  activeAsk=request;input.value='';autoGrow(input);
  $('ask-btn').disabled=true;
  const box=$('msgs');
  if(!box.querySelector('.msg'))box.replaceChildren();
  checkWelcome();
  const turn=createTurn(box,q);
  turn.status.textContent='正在查阅制度…';
  box.scrollTop=box.scrollHeight;
  let citations=[],text='',finished=false;
  try{
    const resp=await fetch(API+'/qa/ask',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({question:q,conversation_id:convId}),signal:request.controller.signal});
    if(!resp.ok||!resp.body)throw new Error('请求失败');
    const reader=resp.body.getReader();
    const decoder=new TextDecoder();
    let buffer='';
    while(activeAsk===request){
      const {done,value}=await reader.read();
      if(done||activeAsk!==request)break;
      buffer+=decoder.decode(value,{stream:true});
      const parts=buffer.split('\n\n');buffer=parts.pop();
      for(const part of parts){
        if(!part.startsWith('data: '))continue;
        const ev=JSON.parse(part.slice(6));
        if(ev.conversation_id&&ev.conversation_id!==convId)selectConversation(ev.conversation_id);
        if(ev.type==='tool_call'){
          addToolCall(turn,ev.id,ev.name,ev.args);
          turn.trace.open=true;
        }else if(ev.type==='tool_result'){
          finishToolCall(turn,ev.id,ev.count,ev.summary,ev.hits);
        }else if(ev.type==='citations'){
          citations=ev.items;
          turn.status.textContent='正在生成回答…';
        }else if(ev.type==='delta'){
          text+=ev.text;
          turn.answer.innerHTML=renderCites(text,citations);
        }else if(ev.type==='refuse'){
          turn.answer.textContent=ev.message;
        }else if(ev.type==='done'||ev.type==='error'){
          finished=true;
          turn.trace.open=false;
          turn.status.textContent=ev.type==='done'?'':ev.message;
          turn.status.classList.toggle('err',ev.type==='error');
        }
        box.scrollTop=box.scrollHeight;
      }
    }
    if(!finished&&activeAsk===request)turn.status.textContent=incompleteLabel('disconnected');
  }catch(error){
    if(activeAsk===request)turn.status.textContent=error.name==='AbortError'
      ?incompleteLabel('disconnected'):'连接失败，回答未完成';
  }finally{
    if(activeAsk===request){
      activeAsk=null;
      $('ask-btn').disabled=false;
      loadConvs();
    }
  }
}
function addMsg(box,role,text){
  const d=document.createElement('div');d.className='msg '+role;
  const b=document.createElement('div');b.className='mbody';b.textContent=text;
  d.appendChild(b);box.appendChild(d);box.scrollTop=box.scrollHeight;
}

/* ---------- 出处抽屉（链路 C） ---------- */
async function showChunk(id){
  const response=await fetch(API+'/chunks/'+id);
  if(!response.ok){
    $('drawer-title').textContent='出处';
    $('drawer-body').textContent='此出处无法打开。';
    $('drawer').classList.add('open');
    return;
  }
  const c=await response.json();
  $('drawer-title').textContent=c.label||'出处';
  let html=`<div class="muted">${esc(c.label)} · 提取方式：${c.source_mode==='ocr'?'OCR 识别（置信度 '+(c.ocr_confidence??'-')+'）':'PDF 文字层直读'}</div>`;
  if(Array.isArray(c.bbox)&&c.bbox.length===4){
    const [bx1,by1,bx2,by2]=c.bbox;
    html+=`<div style="position:relative;margin:12px 0;overflow:hidden;border:1px solid var(--line);border-radius:10px">
      <img src="${API}/documents/${c.doc_id}/page/${c.page_num}.png" alt="第${c.page_num}页原图"
           style="width:100%;display:block" onerror="this.parentElement.style.display='none'">
      <div style="position:absolute;left:${(bx1*100).toFixed(2)}%;top:${(by1*100).toFixed(2)}%;
                  width:${((bx2-bx1)*100).toFixed(2)}%;height:${((by2-by1)*100).toFixed(2)}%;
                  border:2px solid var(--brand);background:rgba(47,84,235,.15);border-radius:4px;
                  box-shadow:0 0 0 9999px rgba(17,24,39,.05)"></div>
    </div>
    <div class="muted" style="margin-bottom:8px">▲ 第 ${c.page_num} 页原文,蓝框 = 当前命中的文本块</div>`;
  }
  if(c.type==='table_full'||c.type==='table_row'){
    html+=`<div class="muted">表格（HTML 结构原样保留）：</div>${c.html||'<pre>'+esc(c.seek_text)+'</pre>'}`;
  }else if(c.type==='figure'){
    html+=c.crop_path?`<img src="${API}/crops/${c.id}" style="max-width:100%;border:1px solid var(--line);border-radius:10px">`:'<div class="muted">（未生成裁图）</div>';
    if(c.vl_desc)html+=`<div class="chunk" style="margin-top:8px"><span class="tag">流程结构</span>${esc(c.vl_desc)}</div>`;
    if(c.linear_text)html+=`<div class="muted">OCR 节点文字：${esc(c.linear_text)}</div>`;
  }else{
    html+=`<pre style="white-space:pre-wrap;background:#f6f9fd;padding:12px;border-radius:10px">${esc(c.seek_text)}</pre>`;
  }
  html+=`<div style="margin-top:12px;display:flex;gap:8px">
         <a class="btn mini ghost" href="${API}/documents/${c.doc_id}/file">下载原文件</a>
         <button class="btn mini ghost" onclick="jumpDoc(${c.doc_id})">在文档库中打开</button></div>`;
  $('drawer-body').innerHTML=html;
  $('drawer').classList.add('open');
  const pv=$('drawer-body').querySelector('[style*="overflow:hidden"]');
  if(pv)setTimeout(()=>pv.scrollIntoView({block:'center',behavior:'smooth'}),150);
}
function closeDrawer(){$('drawer').classList.remove('open');}

/* ---------- 文档库 ---------- */
async function loadDocs(){
  const r=await (await fetch(API+'/documents')).json();
  const s=r.stats;
  $('doc-stats').innerHTML=
    ['files|文件','pages|页','tables|表格','figures|流程图','superseded|旧版'].map(x=>{
      const[k,n]=x.split('|');return `<div class="stat"><b>${s[k]??0}</b><span>${n}</span></div>`;}).join('')+
    (s.pending+s.processing+s.failed?`<div class="stat"><b>${s.pending+s.processing}</b><span>处理中/待处理</span></div>`:'');
  $('doc-rows').innerHTML=(r.documents||[]).map(d=>{
    const acts=[`<button class="btn mini ghost" onclick="showParse(${d.id})">查看解析</button>`];
    if(d.status==='failed')acts.push(`<button class="btn mini ghost" onclick="reparse(${d.id})">重试</button>`);
    return `<tr><td>${esc(d.filename)}</td><td>${d.fmt.replace('.','')}</td>
      <td>${d.page_count??'-'}</td><td>${d.table_count??'-'}</td><td>${d.figure_count??'-'}</td>
      <td>${d.superseded_by?'<span class="pill old">旧版</span>':''}</td>
      <td><span class="pill ${d.status}">${d.status_cn}</span>${d.phase?`<div class="muted">${esc(d.phase)}</div>`:''}
          ${d.status==='failed'&&d.error?`<div class="muted" style="color:var(--err)">原因：${esc(d.error.slice(0,60))}</div>`:''}</td>
      <td>${acts.join(' ')} <button class="btn mini ghost" onclick="delDoc(${d.id})">删除</button></td></tr>`;
  }).join('');
  $('queue-hint').textContent=s.processing?`队列：处理中 ${s.processing} · 待处理 ${s.pending}`:'';
  clearTimeout(docTimer);
  if(s.pending+s.processing>0)docTimer=setTimeout(loadDocs,3000);
}
/* 导入弹窗：批量选择 + 替代旧版本 */
async function openImport(){
  const docs=((await (await fetch(API+'/documents')).json()).documents||[]).filter(d=>d.status==='ready');
  $('modal-title').textContent='导入文档';
  $('modal-body').innerHTML=`
    <div style="margin-bottom:12px"><input type="file" id="imp-files" multiple accept=".doc,.docx,.pdf"></div>
    <label class="muted">替代旧版本（可选）：选中后旧版标为"旧版"，问答默认按新版回答</label>
    <select id="imp-replace" style="width:100%;padding:8px;margin-top:4px;border:1px solid var(--line-strong);border-radius:8px">
      <option value="">不替代</option>
      ${docs.map(d=>`<option value="${d.id}">${esc(d.filename)}</option>`).join('')}
    </select>
    <div class="muted" style="margin-top:6px">重复文件：内容相同则跳过</div>
    <div style="margin-top:16px;text-align:right;display:flex;gap:8px;justify-content:flex-end">
      <button class="btn ghost" onclick="closeModal()">取消</button>
      <button class="btn" onclick="doImport()">开始导入</button>
    </div>`;
  $('modal-bg').classList.add('open');
}
async function doImport(){
  const files=$('imp-files').files;
  const rep=$('imp-replace').value;
  if(!files.length){alert('请选择文件');return;}
  const fd=new FormData();
  for(const f of files)fd.append('files',f,f.name);
  if(rep)fd.append('replaces',rep);
  const r=await (await fetch(API+'/documents',{method:'POST',body:fd})).json();
  closeModal();
  alert(r.results.map(x=>`${x.filename}: ${x.outcome||x.error}`).join('\n'));
  loadDocs();
}
async function delDoc(id){if(!confirm('删除该文档及其索引？'))return;
  await fetch(API+`/documents/${id}`,{method:'DELETE'});loadDocs();}
async function reparse(id){await fetch(API+`/documents/${id}/reparse`,{method:'POST'});loadDocs();}
async function rebuildIndex(){const r=await (await fetch(API+'/index/rebuild',{method:'POST'})).json();
  alert('重建完成：'+r.vectors+' 条向量');}
function jumpDoc(id){document.querySelector('#nav button[data-v=docs]').click();setTimeout(()=>showParse(id),400);}

/* ---------- 解析详情 ---------- */
async function showParse(id){
  const r=await (await fetch(API+`/documents/${id}`)).json();
  $('modal-title').textContent=r.document.filename;
  let html=`<div class="muted" style="margin-bottom:8px">状态：${r.document.status_cn}${r.document.error?' · '+esc(r.document.error):''}
    <button class="btn mini ghost" style="margin-left:8px" onclick="reparse(${id});closeModal()">重新解析</button></div>`;
  html+='<b>目录结构</b><div style="margin:6px 0 12px">'+(r.toc.map(t=>`<div class="toc-item">${esc(t.heading)} <span class="muted">第${t.page_num}页</span></div>`).join('')||'<span class="muted">（未识别到标题）</span>')+'</div>';
  html+='<b>解析块</b><div style="margin-top:6px">'+r.chunks.map((c,i)=>{
    const tag={text:'正文',table_full:'表格',table_row:'表格行',figure:'流程图'}[c.type]||c.type;
    let body='';
    if(c.type==='table_full')body=c.html||esc(c.seek_text);
    else if(c.type==='figure')body=`<div class="muted">OCR 文字：${esc(c.linear_text||'-')}</div>${c.vl_desc?'<div class="muted">VL 结构：'+esc(c.vl_desc)+'</div>':''}`;
    else body=esc(c.seek_text.slice(0,300));
    return `<div class="chunk"><span class="tag">块 #${c.id} ${tag}</span><span class="muted">${esc(c.heading_path)||''} 第${c.page_num}页 · ${c.source_mode==='ocr'?'OCR':'直读'}</span><div style="margin-top:4px">${body}</div></div>`;
  }).join('')+'</div>';
  $('modal-body').innerHTML=html;
  $('modal-bg').classList.add('open');
}
function closeModal(){$('modal-bg').classList.remove('open');}

/* ---------- 评测 ---------- */
async function importCsv(files){
  if(!files.length)return;const fd=new FormData();fd.append('file',files[0]);
  const resp=await fetch(API+'/eval/items/import',{method:'POST',body:fd});
  const r=await resp.json();if(!resp.ok){alert(r.detail||'导入失败');return;}
  alert(`导入 ${r.imported} 题`+(r.errors.length?`，${r.errors.length} 条错误：\n`+r.errors.slice(0,3).join('\n'):''));
  loadEval();
}
async function runEval(){
  const resp=await fetch(API+'/eval/run',{method:'POST'});
  if(!resp.ok){alert((await resp.json()).detail||'运行失败');return;}
  evalRunId=(await resp.json()).run_id;
  $('eval-prog').style.display='';
  pollEval();
}
async function pollEval(){
  const r=await (await fetch(API+`/eval/runs/${evalRunId}`)).json();
  $('eval-prog').textContent=`运行 #${evalRunId} 进度：${r.progress}${r.active?' …':''}`;
  if(r.active){setTimeout(pollEval,3000);return;}
  loadEval();
}
async function loadEval(){
  const items=await (await fetch(API+'/eval/items')).json();
  const runs=await (await fetch(API+'/eval/runs')).json();
  const latest=runs.runs[0];
  $('eval-stats').innerHTML=latest&&latest.summary?[
    ['accuracy','总正确率'],['citation_rate','出处正确率'],['table_accuracy','表格正确率'],
    ['refuse_accuracy','查无正确率'],['mean_duration_ms','平均耗时(ms)']].map(x=>{
      const v=latest.summary[x[0]];return `<div class="stat"><b>${v==null?'-':(x[0].includes('ms')?v:(v*100).toFixed(0)+'%')}</b><span>${x[1]}</span></div>`;}).join(''):'';
  $('eval-rows').innerHTML=(items.items||[]).map(it=>{
    let ans='',cite='-',res='<span class="muted">未跑</span>';
    if(latest&&latest.results){const rr=latest.results.find(x=>x.item_id===it.id);
      if(rr){ans=esc((rr.answer||'').slice(0,80));cite=rr.citation_ok==null?'-':(rr.citation_ok?'✓':'✗');
        res=rr.ok==1?'<span class="pill ready">对</span>':rr.ok==0?'<span class="pill failed">错'+(rr.attribution?`（${{ocr:'OCR',retrieval:'检索',generation:'回答'}[rr.attribution]||rr.attribution}）`:'')+'</span>':'<span class="muted">-</span>';}}
    return `<tr><td>${it.category}</td><td>${esc(it.question)}</td><td>${esc(it.gold_answer.slice(0,60))}</td>
      <td>${ans}</td><td>${cite}</td><td>${res}</td></tr>`;
  }).join('');
}
function esc(s){return (s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
loadConvs();loadDocs();checkWelcome();
const rememberedConversation=Number(sessionStorage.getItem('kb-conversation'));
if(rememberedConversation>0)openConv(rememberedConversation);
